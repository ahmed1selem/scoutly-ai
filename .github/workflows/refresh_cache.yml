name: Weekly FBref Cache Refresh

on:
  schedule:
    # Every Monday at 03:00 UTC — FBref least busy, no match days
    - cron: '0 3 * * 1'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install data-pipeline dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests lxml beautifulsoup4 aiosqlite

      - name: Run FBref cache builder
        run: python -m backend.data_pipeline.cache_builder
        env:
          # Pass any required env vars (none for the public FBref scrape)
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Check cache was built
        run: |
          python - <<'EOF'
          import sqlite3, sys
          conn = sqlite3.connect("data/fbref_cache.db")
          count = conn.execute("SELECT COUNT(*) FROM player_cohort").fetchone()[0]
          conn.close()
          print(f"Cache contains {count} player records")
          if count < 50:
              print("ERROR: too few records — aborting commit")
              sys.exit(1)
          EOF

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fbref_cache.db
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh FBref player cache [skip ci]"
            git push
          fi
