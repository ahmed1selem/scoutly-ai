name: Deploy to Fly.io

on:
  push:
    branches: [main]
    # Only deploy when source code changes (not just cache updates)
    paths-ignore:
      - "data/fbref_cache.db"
      - "**.md"
  workflow_dispatch:   # allow manual deploy from GitHub Actions UI

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
