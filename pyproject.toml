[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutly-ai"
version = "2.0.0"
description = "Multi-agent AI football scouting platform with real data, fit engine, RAG, and HITL debate"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiofiles>=24.0",
    
    # ── AI / LLM ──
    "openai>=1.40.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    
    # ── Vector DB (FAISS via langchain-community; chromadb removed — Rust backend segfaults on some platforms) ──
    "faiss-cpu>=1.7.4",

    # ── Web Search ──
    "tavily-python>=0.5.0",
    
    # ── Football Data ──
    "botasaurus>=4.0",
    "botasaurus-requests>=4.0",
    "botasaurus-driver>=4.0",
    "botasaurus-humancursor>=4.0",
    "botasaurus-api>=4.0",
    "botasaurus-proxy-authentication>=1.0",
    "bota>=4.0",
    "close_chrome>=4.0",
    "lxml>=5.2.2",
    "beautifulsoup4>=4.11.2",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "psutil>=5.9",   # reaps stale headless-Chrome processes during cache builds
    
    # ── Schemas / Config ──
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    
    # ── PDF Reports ──
    "weasyprint>=60.0",
    "jinja2>=3.1",
    
    # ── Visualization ──
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    
    # ── HTTP Client ──
    "httpx>=0.27.0",
    
    # ── MCP ──
    # mcp 2.x renamed FastMCP to MCPServer with a different import path and
    # broke backend/mcp_server/server.py outright on a fresh install — the
    # deployed container silently lost its MCP server to this on a rebuild
    # with no error surfaced anywhere except the process log, and every real
    # scouting request came back with an empty cohort. Upper-bounded until the
    # server is migrated to the v2 API.
    "mcp>=1.0.0,<2.0.0",

    # ── DeepAgents transitive deps (deepagents is vendored in /vendor) ──
    "langchain-anthropic>=1.4.7",
    "langchain-google-genai>=4.2.5",
    "wcmatch>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "langsmith>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["backend"]
