# Fly.io — Scoutly AI single-container deployment
# Deploy:  fly deploy
# Logs:    fly logs
# SSH:     fly ssh console
# Secrets: fly secrets set KEY=VALUE

app = "scoutly-ai"
primary_region = "lhr"        # London — good for European football data

[build]
  dockerfile = "Dockerfile"

[env]
  FBREF_USE_MOCK       = "false"   # use SQLite cache; fall back to mock if cache empty
  MCP_SERVER_HOST      = "localhost"
  MCP_SERVER_PORT      = "8001"
  LANGCHAIN_PROJECT    = "scoutly-ai"
  LANGCHAIN_TRACING_V2 = "true"

# Secrets (set via: fly secrets set KEY=VALUE — never committed to repo):
#   AZURE_OPENAI_API_KEY
#   AZURE_OPENAI_ENDPOINT
#   AZURE_OPENAI_DEPLOYMENT_NAME
#   AZURE_OPENAI_API_VERSION
#   TAVILY_API_KEY
#   LANGSMITH_API_KEY / LANGCHAIN_API_KEY
#   LANGCHAIN_ENDPOINT

[[services]]
  protocol    = "tcp"
  internal_port = 8000
  auto_stop_machines  = "stop"    # machines stop when idle (saves cost)
  auto_start_machines = true

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval      = "30s"
    timeout       = "10s"
    grace_period  = "20s"
    method        = "GET"
    path          = "/api/health"
    protocol      = "http"

[[vm]]
  size   = "shared-cpu-1x"   # cheapest — ~$2/mo or free-tier eligible
  memory = "512mb"            # 512MB handles both processes comfortably
