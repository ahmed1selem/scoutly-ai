# Fly.io configuration — Scoutly AI
# App: https://scoutly-ai.fly.dev
# Docs: https://fly.io/docs/reference/configuration/

app            = "scoutly-ai"
primary_region = "lhr"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  FBREF_USE_MOCK       = "false"
  MCP_SERVER_HOST      = "localhost"
  MCP_SERVER_PORT      = "8001"
  LANGCHAIN_PROJECT    = "scoutly-ai"
  LANGCHAIN_TRACING_V2 = "true"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "30s"
    interval     = "30s"
    method       = "GET"
    timeout      = "10s"
    path         = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
