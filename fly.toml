# fly.toml app configuration file generated for scoutly-ai on 2026-06-26T18:08:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scoutly-ai'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  FBREF_USE_MOCK = 'false'
  LANGCHAIN_PROJECT = 'scoutly-ai'
  LANGCHAIN_TRACING_V2 = 'true'
  MCP_SERVER_HOST = 'localhost'
  MCP_SERVER_PORT = '8001'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
